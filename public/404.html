<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página Não Encontrada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0D4E3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Nuvens */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            animation: float 20s infinite linear;
        }

        .cloud1 {
            width: 100px;
            height: 30px;
            top: 10%;
            left: -100px;
            animation-duration: 25s;
        }

        .cloud1::before {
            content: '';
            position: absolute;
            background: white;
            width: 50px;
            height: 40px;
            border-radius: 50%;
            top: -15px;
            left: 20px;
        }

        .cloud1::after {
            content: '';
            position: absolute;
            background: white;
            width: 40px;
            height: 35px;
            border-radius: 50%;
            top: -10px;
            right: 20px;
        }

        .cloud2 {
            width: 80px;
            height: 25px;
            top: 20%;
            left: -80px;
            animation-duration: 30s;
            animation-delay: 5s;
        }

        .cloud2::before {
            content: '';
            position: absolute;
            background: white;
            width: 40px;
            height: 30px;
            border-radius: 50%;
            top: -12px;
            left: 15px;
        }

        .cloud3 {
            width: 120px;
            height: 35px;
            top: 15%;
            right: -120px;
            animation: float-reverse 28s infinite linear;
        }

        .cloud3::before {
            content: '';
            position: absolute;
            background: white;
            width: 60px;
            height: 45px;
            border-radius: 50%;
            top: -18px;
            left: 25px;
        }

        @keyframes float {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        @keyframes float-reverse {
            from { transform: translateX(0); }
            to { transform: translateX(calc(-100vw - 200px)); }
        }

        /* Container Principal */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* Título OOPS! */
        .oops {
            font-size: 1.5rem;
            color: #4A4A4A;
            letter-spacing: 8px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Número 404 */
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #4A4A4A;
            line-height: 1;
            margin: 20px 0;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        /* Subtítulo */
        .subtitle {
            font-size: 1.2rem;
            color: #6B6B6B;
            letter-spacing: 3px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        /* Cenário do chão */
        .ground-scene {
            width: 600px;
            height: 200px;
            position: relative;
            margin: 0 auto;
        }

        /* Chão */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #8B8B8B;
            border-radius: 10px 10px 0 0;
        }

        .ground::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 20px,
                transparent 20px,
                transparent 40px
            );
        }

        /* Caminhão */
        .truck {
            position: absolute;
            bottom: 60px;
            left: 50px;
            width: 180px;
            height: 80px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-2px) rotate(-1deg); }
            75% { transform: translateY(2px) rotate(1deg); }
        }

        /* Cabine do caminhão */
        .truck-cabin {
            position: absolute;
            right: 10px;
            bottom: 25px;
            width: 60px;
            height: 45px;
            background: #D4A574;
            border-radius: 5px 15px 5px 5px;
            border: 3px solid #8B6F47;
        }

        /* Janela */
        .truck-window {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 35px;
            height: 25px;
            background: #87CEEB;
            border-radius: 3px;
            border: 2px solid #8B6F47;
        }

        /* Caçamba */
        .truck-bed {
            position: absolute;
            left: 0;
            bottom: 25px;
            width: 120px;
            height: 35px;
            background: #D4A574;
            border-radius: 5px;
            border: 3px solid #8B6F47;
        }

        /* Rodas */
        .wheel {
            position: absolute;
            bottom: 0;
            width: 35px;
            height: 35px;
            background: #2C2C2C;
            border-radius: 50%;
            border: 5px solid #1A1A1A;
        }

        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #666;
            border-radius: 50%;
        }

        .wheel-front {
            right: 20px;
        }

        .wheel-back {
            left: 30px;
        }

        /* Placa de ERROR */
        .error-sign {
            position: absolute;
            bottom: 60px;
            right: 150px;
            width: 80px;
            height: 80px;
        }

        .sign-post {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 100px;
            background: #8B8B8B;
        }

        .sign-board {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: #FFD700;
            border: 4px solid #333;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #333;
            transform: translateX(-50%) rotate(-5deg);
        }

        /* Árvore */
        .tree {
            position: absolute;
            bottom: 60px;
            right: 50px;
            width: 50px;
            height: 100px;
        }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 40px;
            background: #8B6F47;
            border-radius: 3px;
        }

        .tree-leaves {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: #90EE90;
            border-radius: 50%;
            border: 3px solid #228B22;
        }

        .tree-leaves::before,
        .tree-leaves::after {
            content: '';
            position: absolute;
            background: #90EE90;
            border-radius: 50%;
            border: 3px solid #228B22;
        }

        .tree-leaves::before {
            width: 40px;
            height: 40px;
            top: -15px;
            left: -10px;
        }

        .tree-leaves::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: -10px;
        }

        /* Linhas de movimento */
        .motion-lines {
            position: absolute;
            bottom: 90px;
            left: 20px;
        }

        .motion-line {
            width: 25px;
            height: 3px;
            background: #666;
            margin: 5px 0;
            border-radius: 2px;
            animation: move 0.8s infinite;
        }

        .motion-line:nth-child(1) {
            animation-delay: 0s;
        }

        .motion-line:nth-child(2) {
            animation-delay: 0.2s;
            width: 20px;
        }

        @keyframes move {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-30px); }
        }

        /* Botão */
        .btn-home {
            margin-top: 50px;
            padding: 15px 40px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-home:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }

            .ground-scene {
                width: 90%;
                transform: scale(0.8);
            }

            .oops {
                font-size: 1.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Nuvens -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="container">
        <!-- Texto -->
        <div class="oops">OOPS!</div>
        <div class="error-code">404</div>
        <div class="subtitle">Algo deu erro, tente novamente mais tarde!</div>

        <!-- Cenário -->
        <div class="ground-scene">
            <!-- Caminhão -->
            <div class="truck">
                <div class="motion-lines">
                    <div class="motion-line"></div>
                    <div class="motion-line"></div>
                </div>
                <div class="truck-bed"></div>
                <div class="truck-cabin">
                    <div class="truck-window"></div>
                </div>
                <div class="wheel wheel-back"></div>
                <div class="wheel wheel-front"></div>
            </div>

            <!-- Placa de ERROR -->
            <div class="error-sign">
                <div class="sign-post"></div>
                <div class="sign-board">ERROR</div>
            </div>

            <!-- Árvore -->
            <div class="tree">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>

            <!-- Chão -->
            <div class="ground"></div>
        </div>

        <!-- Botão -->
        <button class="btn-home" onclick="window.location.href='/'">
            🏠 Voltar
        </button>
    </div>

    <script>
        // Efeito de paralaxe no mouse
        document.addEventListener('mousemove', (e) => {
            const truck = document.querySelector('.truck');
            const tree = document.querySelector('.tree');
            const sign = document.querySelector('.error-sign');
            
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            truck.style.transform = `translate(${moveX}px, ${moveY}px)`;
            tree.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
            sign.style.transform = `translate(${moveX * 0.5}px, ${moveY * 0.5}px)`;
        });
    </script>
</body>
</html>
